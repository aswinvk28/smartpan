name: Goodnex
type: theme
description: 'Responsive Drupal 8 Theme'
package: Smartpan Theme
core: 8.x
engine: phptemplate
regions:
  header_left: 'Header Left'
  header_right: 'Header Right'
  header_menu: 'Header Menu'
  header_search: 'Header Search'
  content: 'Content'
  before_content_no_wrap: 'Before Content No Wrap'
  before_content: 'Before Content'
  after_content: 'Afetr Content'
  after_content_no_wrap: 'After Content No Wrap'
  sidebar_left: 'Left Sidebar'
  sidebar_right: 'Right Sidebar'
  footer_1: 'Footer Box 1'
  footer_2: 'Footer Box 2'
  footer_3: 'Footer Box 3'
  footer_4: 'Footer Box 4'
  footer_bottom: 'Footer Bottom'
  page_top: 'Page top'
  page_bottom: 'Page bottom'
settings:
  shortcut_module_link: '0'
  clear_registry: '0'
  sticky_header: '1'
  black_and_white: '1'
  breadcrumbs: '0'
  color_scheme: 'color-1'
  skin_style: 'normal'
  site_layout: 'wide'
  body_backgrounds: 'goodnex_backgrounds'
  background_select: 'pattern-1'
  portfolio_columns: 'four columns'
  meta_title: '1'
  meta_date: '1'
  meta_author: '1'
  meta_tags: '1'
  meta_comments: '1'
stylesheets:
  all:
    - style.css
    - css/style.css
    - css/drupal.css
    - css/skeleton.css
    - css/layout.css
    - js/fancybox/jquery.fancybox-1.3.4.css
    - js/flexslider/css/flexslider.css
    - js/mediaelement/jquery.mediaelementplayer.css
    - css/font-awesome.css
scripts:
  - js/jquery.modernizr.js
  - js/jquery.easing.1.3.min.js
  - js/jquery.cycle.all.min.js
  - js/jquery.blackandwhite.min.js
  - js/mediaelement/mediaelement-and-player.min.js
  - js/jquery.jcarousel.min.js
  - js/jquery.jflickrfeed.min.js
  - js/jquery.touchswipe.min.js
  - js/jquery.isotope.min.js
  - js/mobile-map.js
  - js/fancybox/jquery.fancybox-1.3.4.pack.js
  - js/flexslider/js/jquery.flexslider-min.js
  - js/config.js
  - js/custom.js
  - js/goodnex.js